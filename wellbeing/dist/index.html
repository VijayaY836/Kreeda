der guidance first; never move the neck under load."],contraindications:["neck","high_bp","heart_condition","vertigo","pregnancy","eye_condition"],sources:[$e]},{id:"sirsasana",section:"yoga",category:"asana",name:"Sirsasana",name_iast:"Śīrṣāsana",name_english:"Headstand",posture_group:"inverted",level:"advanced",unlock_after_sessions:40,focus_tags:["balance","focus"],component_tags:["balance","strength"],duration_sec:{min:10,default:30,max:120},steps:["Interlace the fingers and place the forearms on the floor, crown of the head cradled in the palms.","Walk the feet in and lift the hips over the shoulders.","Draw the legs up slowly, engaging the core to balance.","Come down slowly and rest in Shashankasana afterward."],benefits:['Traditionally called the "king of asanas" for balance and concentration.'],cautions:["Practice against a wall and only with prior guidance; never attempted by beginners."],contraindications:["neck","high_bp","heart_condition","vertigo","eye_condition","pregnancy"],sources:[$e]}],l0=[{id:"nadi-shodhana",section:"yoga",category:"pranayama",name:"Nadi Shodhana",name_iast:"Nāḍī Śodhana",name_english:"Alternate Nostril Breathing",posture_group:"sitting",level:"beginner",unlock_after_sessions:0,focus_tags:["stress","focus","sleep"],component_tags:["breathing","mind"],duration_sec:{min:60,default:180,max:600},rounds:{min:5,default:9,max:20},steps:["Sit tall and rest the left hand on the knee.","Close the right nostril with the thumb, inhale through the left.","Close the left nostril with the ring finger, release the thumb, exhale through the right.","Inhale right, then switch and exhale left — this completes one round."],benefits:["Traditionally associated with a calm, balanced mind."],cautions:["Breathe gently; never force or strain the breath."],contraindications:[],sources:[we]},{id:"sheetali",section:"yoga",category:"pranayama",name:"Sheetali",name_iast:"Śītalī",name_english:"Cooling Breath",posture_group:"sitting",level:"beginner",unlock_after_sessions:0,focus_tags:["stress"],component_tags:["breathing"],duration_sec:{min:60,default:120,max:300},rounds:{min:5,default:9,max:15},steps:["Sit comfortably and curl the tongue lengthwise (or purse the lips if that is not possible).","Inhale slowly through the curled tongue or pursed lips.","Close the mouth and exhale slowly through the nose.","Repeat for several rounds."],benefits:["Traditionally associated with a cooling, calming effect on the body."],cautions:["Avoid in very cold weather or with respiratory infection."],contraindications:[],sources:[we]},{id:"bhramari",section:"yoga",category:"pranayama",name:"Bhramari",name_iast:"Bhrāmarī",name_english:"Bee Breath",posture_group:"sitting",level:"beginner",unlock_after_sessions:0,focus_tags:["stress","sleep","focus"],component_tags:["breathing","mind"],duration_sec:{min:60,default:120,max:300},rounds:{min:5,default:9,max:15},steps:["Sit comfortably, close the eyes, and gently plug the ears with the thumbs.","Rest the fingers lightly over the closed eyes and brow.","Inhale, then exhale slowly making a low humming sound like a bee.","Repeat for several rounds, then sit quietly."],benefits:["Traditionally associated with easing anxiety and settling the mind."],cautions:["Keep the humming soft and comfortable, never straining the throat."],contraindications:["eye_condition"],sources:[we]},{id:"kapalabhati",section:"yoga",category:"pranayama",name:"Kapalabhati",name_iast:"Kapālabhāti",name_english:"Skull-Shining Breath",posture_group:"sitting",level:"intermediate",unlock_after_sessions:10,focus_tags:["focus","stamina"],component_tags:["breathing"],duration_sec:{min:20,default:60,max:180},rounds:{min:1,default:3,max:5},steps:["Sit tall with a relaxed inhale.","Exhale sharply through the nose by pulling the abdomen in, in quick pulses.","Let the inhale happen passively between pulses.","Do one round of pulses, then breathe normally before repeating."],benefits:["A traditional cleansing breath (the sole shatkarma exercise considered simple and safe enough for general practice, already included in CYP)."],cautions:["Stop if lightheaded; practice on an empty stomach."],contraindications:["high_bp","heart_condition","pregnancy","hernia","recent_surgery","vertigo"],sources:[we]}],s0=[...t0,...a0,...n0,...l0],Om={title:"Akhada tradition — verify against academic source",ref:"TBD"},yl={title:"Joseph S. Alter — The Wrestler's Body: Identity and Ideology in North India (University of California Press, 1992)",ref:"publishing.cdlib.org/ucpressebooks/view?docId=ft6n39p104"},i0=[{id:"dand-knee-supported",section:"vyayam",category:"dand",name:"Dand (Knee-Supported)",name_english:"Knee-Supported Hindu Push-up",posture_group:"prone",level:"beginner",unlock_after_sessions:0,focus_tags:["strength","stamina"],component_tags:["strength"],reps:{min:5,default:8,max:20},steps:["Start on hands and knees, hands slightly ahead of the shoulders.","Dip the chest forward and down in a scooping arc, close to the floor.","Sweep the chest through and press up, arching the back and looking up at the top — like a slow-motion cobra.","Reverse the arc back to the start position for one rep."],benefits:["Traditionally associated with building upper-body and core strength gradually."],cautions:["Move slowly through the arc; stop if the wrists or lower back complain."],contraindications:["shoulder","back_disc"],variants:["dand-basic","dand-full"],sources:[yl]},{id:"dand-basic",section:"vyayam",category:"dand",name:"Dand (Basic)",name_english:"Hindu Push-up",posture_group:"prone",level:"beginner",unlock_after_sessions:8,focus_tags:["strength","stamina"],component_tags:["strength","endurance"],reps:{min:5,default:10,max:40},steps:["Start in a downward-dog-like position, hips high, hands and feet on the floor.","Dip the chest forward in a low sweeping arc between the hands.","Sweep through low to the ground and press up into an upward arch, chest open.","Push back to the hips-high start to complete one rep."],benefits:["The classic akhada strength exercise, traditionally paired with Baithak; associated with full-body strength and stamina."],cautions:["Keep the arc controlled rather than fast; build reps gradually per the ardhashakti principle."],contraindications:["shoulder","back_disc","high_bp"],variants:["dand-knee-supported","dand-full"],sources:[yl]},{id:"dand-full",section:"vyayam",category:"dand",name:"Dand (Full)",name_english:"Full Hindu Push-up Set",posture_group:"prone",level:"advanced",unlock_after_sessions:30,focus_tags:["strength","stamina"],component_tags:["strength","endurance"],reps:{min:15,default:25,max:100},steps:["Perform the full Dand arc as in the basic variant, without pausing between reps.","Keep an even, continuous rhythm across a high-rep set.","Maintain full range of motion — deep dip, full arch — even as fatigue builds."],benefits:["High-rep dand sets are the traditional akhada measure of stamina; wrestlers historically trained in the hundreds per day."],cautions:["Only progress here after full range Dand is comfortable at moderate reps."],contraindications:["shoulder","back_disc","high_bp","heart_condition"],variants:["dand-basic"],sources:[yl]},{id:"baithak-basic",section:"vyayam",category:"baithak",name:"Baithak (Basic)",name_english:"Hindu Squat",posture_group:"standing",level:"beginner",unlock_after_sessions:0,focus_tags:["strength","stamina"],component_tags:["strength","endurance"],reps:{min:10,default:15,max:50},steps:["Stand with feet just wider than the hips, heels on the floor.","Squat down fully, swinging the arms straight back behind you as you descend.","At the bottom, swing the arms forward and rise back to standing in one fluid motion.","Keep a steady, rhythmic pace."],benefits:["A staple of akhada training alongside Dand; traditionally associated with leg strength and stamina."],cautions:["Keep heels down and knees tracking over the toes; reduce depth if the knees are sensitive."],contraindications:["knee","high_bp"],variants:["baithak-high-rep","baithak-slow-tempo"],sources:[yl]},{id:"baithak-high-rep",section:"vyayam",category:"baithak",name:"Baithak (High Rep)",name_english:"High-Rep Hindu Squat Set",posture_group:"standing",level:"intermediate",unlock_after_sessions:12,focus_tags:["stamina","strength"],component_tags:["endurance","cardio"],reps:{min:30,default:50,max:150},steps:["Perform the Baithak in continuous sets without pausing at the top.","Keep the arm swing rhythmic to help maintain pace across a long set.","Breathe steadily throughout; the Great Gama is said to have trained in the thousands per day."],benefits:["Traditionally used to build the deep muscular endurance akhada wrestlers were known for."],cautions:["Build up rep counts gradually across weeks, never in one jump."],contraindications:["knee","high_bp","heart_condition"],variants:["baithak-basic","baithak-slow-tempo"],sources:[yl]},{id:"baithak-slow-tempo",section:"vyayam",category:"baithak",name:"Baithak (Slow Tempo)",name_english:"Slow-Tempo Hindu Squat",posture_group:"standing",level:"intermediate",unlock_after_sessions:12,focus_tags:["strength"],component_tags:["strength"],reps:{min:8,default:12,max:25},steps:["Perform the Baithak descent over a slow count (4-6 seconds).","Pause briefly at the bottom of the squat.","Rise slowly with control over an equal count."],benefits:["Traditionally used as a strength-focused variation once basic stamina is established."],cautions:["Slower tempo increases strain on the knees — keep depth moderate if needed."],contraindications:["knee","high_bp"],variants:["baithak-basic"],sources:[yl]},{id:"sapate",section:"vyayam",category:"sapate",name:"Sapate",name_english:"Jumping Lunge Set",posture_group:"standing",level:"intermediate",unlock_after_sessions:15,focus_tags:["strength","stamina"],component_tags:["strength","cardio"],reps:{min:6,default:12,max:40},steps:["Start in a low lunge, one leg forward, one back.","Jump and switch the legs mid-air, landing softly in the opposite lunge.","Keep landings light and controlled, absorbing through the bent front knee.","Continue alternating for the set."],benefits:["A traditional akhada conditioning drill for explosive leg strength and cardiovascular stamina."],cautions:["Higher-impact than Dand-Baithak — only introduced once the basics are comfortable."],contraindications:["knee","high_bp","heart_condition","back_disc","pregnancy"],sources:[Om]},{id:"vyayam-mobility-drills",section:"vyayam",category:"mobility",name:"Sukshma Vyayama Drills",name_english:"Joint Mobility Warm-up",posture_group:"standing",level:"beginner",unlock_after_sessions:0,focus_tags:["flexibility","stamina"],component_tags:["flexibility","cardio"],duration_sec:{min:60,default:120,max:240},steps:["Ankle circles and calf raises, both directions.","Hip circles and gentle standing knee lifts.","Arm swings — forward, backward, and across the chest.","Light jogging on the spot or side-steps to raise the heart rate."],benefits:["Traditional akhada-style joint-loosening drills used before Dand-Baithak sets."],cautions:["Keep movements light and rhythmic — this is a warm-up, not the main effort."],contraindications:[],sources:[Om]}],u0=[{id:"anapana",section:"dhyana",category:"meditation",name:"Anapana",name_english:"Breath Awareness",posture_group:"sitting",tradition:"Buddhist",level:"beginner",unlock_after_sessions:0,focus_tags:["stress","focus","sleep"],component_tags:["mind","breathing"],duration_sec:{min:180,default:300,max:1200},steps:["Sit comfortably, spine upright, eyes closed.","Bring full attention to the natural breath at the nostrils.","Simply notice the sensation of air entering and leaving — no controlling the breath.","Each time the mind wanders, gently return attention to the breath."],benefits:["The default entry point to meditation in this module; traditionally associated with a settled, focused mind."],cautions:["No claims are made about treating anxiety or any condition; stop and rest if uncomfortable."],contraindications:[],sources:[{title:"Vipassana Research Institute — What is Anapana? (S.N. Goenka tradition)",ref:"vridhamma.org/What-is-Anapana"}]},{id:"walking-meditation",section:"dhyana",category:"meditation",name:"Cankamana",name_iast:"Caṅkamana",name_english:"Walking Meditation",posture_group:null,tradition:"Buddhist",level:"beginner",unlock_after_sessions:0,focus_tags:["stress"],component_tags:["mind"],duration_sec:{min:180,default:300,max:900},steps:["Choose a quiet stretch of 8-10 steps, indoors or outdoors.","Walk slowly and deliberately, attention on the sensation of each foot lifting, moving and placing.","At the end of the stretch, pause, turn mindfully, and walk back.","Continue for the chosen duration, keeping the pace unhurried."],benefits:["Offered for users who find sitting still difficult; traditionally associated with grounded, present awareness."],cautions:["Choose a flat, obstacle-free path."],contraindications:[],sources:[{title:"Caṅkama Sutta (AN 5.29) — Walking, tr. Bhikkhu Bodhi",ref:"suttacentral.net/an5.29/en/bodhi"}]},{id:"japa",section:"dhyana",category:"meditation",name:"Om Japa",name_iast:"Oṃ Japa",name_english:"Chanting / Silent Repetition",posture_group:"sitting",tradition:"Vedic / Hindu",level:"beginner",unlock_after_sessions:0,focus_tags:["stress","focus"],component_tags:["mind","breathing"],duration_sec:{min:180,default:300,max:900},steps:["Sit comfortably with the spine upright.",'Chant "Om" aloud slowly three times, feeling the vibration.',"Continue repeating it silently in the mind, or switch to a neutral hum / mental count for a non-religious variant.","Let each repetition settle the mind further before finishing in silence."],benefits:["Traditionally associated with a settled, one-pointed mind."],cautions:["A neutral humming or counting variant is offered for users who prefer it."],contraindications:[],sources:[{title:"Patañjali, Yoga Sūtras 1.27–1.28 (praṇava and its japa)",ref:"wisdomlib.org/hinduism/book/yoga-sutras-with-bhojas-rajamartanda/d/doc1217023.html"}]},{id:"trataka",section:"dhyana",category:"meditation",name:"Trataka",name_iast:"Trāṭaka",name_english:"Candle / Point Gazing",posture_group:"sitting",tradition:"Yogic",level:"beginner",unlock_after_sessions:3,focus_tags:["focus"],component_tags:["mind"],duration_sec:{min:60,default:180,max:600},steps:["Sit at arm's length from a candle flame or a fixed dot on the wall, at eye level.","Gaze steadily at the point without blinking for as long as comfortable.","Close the eyes when they tire and observe the after-image inwardly.","Repeat a few rounds, finishing with the eyes closed and resting."],benefits:["Traditionally associated with concentration and steadiness of mind."],cautions:["A wall-dot variant (no flame) is offered; those with eye conditions should use short rounds or skip."],contraindications:["eye_condition"],sources:[{title:"Haṭha Yoga Pradīpikā 2.31–2.32 (Trāṭaka), tr. Pancham Sinh",ref:"sacred-texts.com/hin/hyp/hyp04.htm"}]},{id:"maitri",section:"dhyana",category:"meditation",name:"Maitri Bhavana",name_iast:"Maitrī Bhāvanā",name_english:"Loving-Kindness Meditation",posture_group:"sitting",tradition:"Buddhist",level:"intermediate",unlock_after_sessions:10,focus_tags:["stress","mood"],component_tags:["mind"],duration_sec:{min:180,default:300,max:900},steps:["Sit comfortably and settle the breath.",'Silently offer well-wishes to yourself: "May I be well, may I be at ease."',"Extend the same wish to someone you care about, then to a neutral person.","Extend it further to someone difficult, and finally to all beings."],benefits:["Traditionally associated with warmth toward oneself and others, and easing negative mood."],cautions:["Move through the stages at your own pace; skipping a stage is fine."],contraindications:[],sources:[{title:"Karaṇīya Mettā Sutta (Snp 1.8), tr. Bhikkhu Sujato",ref:"suttacentral.net/snp1.8/en/sujato"}]},{id:"preksha-dhyana",section:"dhyana",category:"meditation",name:"Preksha Dhyana",name_iast:"Prekṣā Dhyāna", s",fact:"Indian-club swinging spread further into American gymnasiums and physical-culture programmes in the early 20th century.",how:"Spread through the same physical-culture movement that popularised Indian clubs in the West.",image:Me("indian-clubs")}],sources:[{title:"Sushruta Samhita, Cikitsāsthāna ch. 24 (Anāgatābādhapratiṣedha) — ardhashakti vyāyāma",ref:"wisdomlib.org/hinduism/book/sushruta-samhita-volume-4-cikitsasthana"},{title:"Mānasollāsa of King Someśvara (12th c.), Mallavinoda section — ed. G. K. Shrigondekar, Gaekwad's Oriental Series, 3 vols. (1925–61)",ref:"archive.org/details/in.ernet.dli.2015.344930"},{title:"Mallapurāṇa — ed. B. J. Sandesara & R. N. Mehta, Gaekwad's Oriental Series 144 (Oriental Institute, Baroda, 1964)",ref:"archive.org/details/mallapurana_full_colour_scan"}]},dhyana:{section:"dhyana",title:"Dhyana",nativeName:"ధ్యానం",tagline:"Meditation across India's traditions — Buddhist, Vedic, Jain and Yogic — for a quieter mind.",color:"var(--color-navy)",heroImage:Me("dhyana-hero"),timeline:[{id:"patanjali-dhyana",era:"c. 2nd century BCE – 4th century CE",title:"Patanjali's Yoga Sutras",text:"Names dharana (concentration), dhyana (meditation) and samadhi (absorption) as the final three limbs of yoga, following directly from Section A's asana and pranayama.",image:Me("patanjali")},{id:"beatles-rishikesh",era:"1968",title:"The Beatles in Rishikesh",text:"The Beatles' stay at Maharishi Mahesh Yogi's ashram brought global pop-culture attention to Indian meditation.",image:Me("rishikesh-beatles-ashram")},{id:"goenka-vipassana",era:"20th century –",title:"S.N. Goenka's Vipassana Centres",text:"Goenka helped re-establish and globally spread 10-day Vipassana courses rooted in the Anapana technique.",image:Me("vipassana")},{id:"preksha-systematised",era:"20th century",title:"Preksha Dhyana Systematised",text:"Acharya Mahapragya organised the Jain tradition's perception-based meditation into the structured practice of Preksha Dhyana.",image:Me("pr
