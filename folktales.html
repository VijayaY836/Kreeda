<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KREEDA — Folktales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Sora:wght@400;500;600;700&family=Tiro+Telugu&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --ink:#2A241E;
    --ink-soft:#5C5142;
    --navy:#1F3A5C;
    --gold-deep:#C4881F;
    --brick:#A8402E;
    --evergreen:#1F3B2E;
    --rose:#C0524A;
    --plum:#4A3558;
    --gold:#C7A467;
    --cream-card:#F6EFDE;
    --cream:#FBF3E2;
    --page-bg:#F1E8D2;
    --highlight:#F3DDA8;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    min-height:100vh;
    background:var(--page-bg);
    color:var(--ink);
    font-family:'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .view{display:none;}
  .view.active{display:block;}

  /* ---------- shared header controls ---------- */
  .header-controls{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .pill-lang{
    appearance:none; -webkit-appearance:none;
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(42,36,30,0.16);
    background:rgba(251,243,226,0.9);
    color:var(--ink);
    font-family:'Sora', sans-serif;
    font-size:13px;
    font-weight:500;
    text-decoration:none;
    cursor:pointer;
    transition:border-color .18s ease, background .18s ease;
  }
  .pill-lang:hover{ border-color:var(--gold); background:#FFFBF0; }
  .pill-lang:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .pill-lang svg{ width:1em; height:1em; opacity:.7; }
  .pill-lang .chev{ width:.7em; height:.7em; opacity:.55; }

  .avatar{
    appearance:none; -webkit-appearance:none;
    width:40px; height:40px;
    border-radius:50%;
    background:var(--evergreen);
    border:1px solid var(--gold);
    color:var(--cream);
    font-family:'Sora', sans-serif;
    font-weight:600;
    font-size:14px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:filter .18s ease;
  }
  .avatar:hover{ filter:brightness(1.15); }
  .avatar:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .btn-primary{
    appearance:none; -webkit-appearance:none;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 20px;
    border-radius:999px;
    border:1px solid var(--gold);
    background:var(--evergreen); color:var(--cream);
    font-family:'Sora',sans-serif; font-size:13.5px; font-weight:600;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(31,59,46,0.22);
    transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;
  }
  .btn-primary:hover{ transform:translateY(-2px); filter:brightness(1.12); box-shadow:0 10px 24px rgba(31,59,46,0.28); }
  .btn-primary:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .btn-primary svg{ width:1.1em; height:1.1em; }

  /* ---------- Grandmother placeholder ----------
     Her artwork is being made by the team. Drop it in as
     Grandmother.png (next to this page) fills the Categories placeholder. */
  .grandmother-mascot{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    border-radius:16px;
    overflow:hidden;
  }
  .grandmother-mascot img{ width:100%; height:100%; object-fit:contain; display:block; }
  .grandmother-mascot .gm-placeholder{ display:none; }
  .grandmother-mascot.no-img{
    background:
      radial-gradient(rgba(196,136,31,0.18) 1px, transparent 1.4px) 0 0 / 12px 12px,
      color-mix(in srgb, var(--gold) 16%, var(--cream));
    border:1px dashed rgba(196,136,31,0.6);
  }
  .grandmother-mascot.no-img .gm-placeholder{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:var(--gold-deep);
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    text-align:center;
  }
  .gm-placeholder svg{ width:44%; max-width:96px; height:auto; }

  /* ================= CATEGORIES VIEW (pinned illustration, as on Games) ================= */
  .hero.view.active{
    position:relative;
    display:block;
    width:fit-content;
    margin:0 auto;
    line-height:0;
  }
  .hero .bg{
    display:block;
    max-width:100vw;
    max-height:100vh;
    width:auto;
    height:auto;
  }
  .hero-content{
    position:absolute;
    inset:0;
    line-height:normal;
    container-type:size;
  }
  .hero .header-controls{ position:absolute; top:4.8%; right:2.5%; }
  .hero .home-link{ position:absolute; top:4.8%; left:2.5%; }
  .hero .pill-lang{ font-size:clamp(10px, 0.8cqw, 13px); }
  .hero .avatar{ width:clamp(26px, 2.4cqw, 40px); height:clamp(26px, 2.4cqw, 40px); font-size:clamp(10px, 0.85cqw, 14px); }

  .header-block{
    position:absolute;
    left:50%; top:7%;
    transform:translateX(-50%);
    text-align:center;
  }
  .masthead{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-size:clamp(20px, 3.2cqw, 52px);
    letter-spacing:0.01em;
    color:var(--evergreen);
    margin:0;
  }

  .narrator{
    position:absolute;
    left:3.5%; bottom:12%;
    width:14%;
    display:flex; flex-direction:column; align-items:center;
    gap:clamp(4px, 0.8cqw, 14px);
  }
  .narrator .grandmother-mascot{
    width:100%;
    background:#fff;
    aspect-ratio:1;
    box-shadow:0 clamp(2px,0.5cqw,10px) clamp(6px,1.4cqw,26px) rgba(42,30,20,0.18);
  }
  .speech{
    position:relative;
    background:var(--cream-card);
    border:1px solid var(--gold);
    border-radius:clamp(8px, 0.9cqw, 14px);
    padding:clamp(5px,0.7cqw,12px) clamp(6px,0.9cqw,14px);
    font-family:'Fraunces', Georgia, serif;
    font-style:italic;
    font-size:clamp(8px, 0.82cqw, 14px);
    line-height:1.4;
    color:var(--ink);
    text-align:center;
    box-shadow:0 4px 14px rgba(42,30,20,0.12);
  }
  .speech::after{
    content:"";
    position:absolute; left:50%; bottom:-7px;
    width:12px; height:12px;
    background:var(--cream-card);
    border-right:1px solid var(--gold);
    border-bottom:1px solid var(--gold);
    transform:translateX(-50%) rotate(45deg);
  }

  .cards-block{
    position:absolute;
    left:55%; top:18%;
    transform:translateX(-50%);
    width:62%;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    column-gap:2.4cqw;
    row-gap:2cqw;
  }
  .cat-card{
    appearance:none; -webkit-appearance:none;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:0;
    text-align:center;
    font:inherit; color:inherit;
    background:var(--cream-card);
    border-radius:clamp(6px, 0.9cqw, 16px);
    border:clamp(1px, 0.14cqw, 2.5px) solid var(--accent);
    box-shadow:0 clamp(2px,0.5cqw,10px) clamp(6px,1.4cqw,26px) rgba(42,30,20,0.22);
    cursor:pointer;
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .cat-card:hover{
    transform:translateY(clamp(-8px,-0.45cqw,-3px));
    box-shadow:0 clamp(4px,0.9cqw,16px) clamp(10px,2.2cqw,38px) rgba(42,30,20,0.28);
  }
  .cat-card:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .cat-card .illustration{
    width:100%;
    aspect-ratio:5/2;
    border-radius:clamp(5px,0.8cqw,14px) clamp(5px,0.8cqw,14px) 0 0;
    overflow:hidden;
    background:color-mix(in srgb, var(--accent) 14%, var(--cream));
  }
  .cat-card .illustration img{ width:100%; height:100%; object-fit:cover; object-position:center 30%; display:block; }
  .cat-card .card-body{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(4px,0.7cqw,14px) clamp(4px,0.8cqw,14px) clamp(5px,0.9cqw,16px);
  }
  .card-eyebrow{
    font-size:clamp(5.5px, 0.56cqw, 10px);
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 clamp(2px,0.25cqw,5px);
  }
  .cat-card h2{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-size:clamp(9px, 1.25cqw, 22px);
    line-height:1.12;
    margin:0;
    color:var(--ink);
    text-wrap:balance;
  }
  .pick-wrap{
    display:flex; justify-content:center;
    margin-top:clamp(8px, 1.8cqw, 30px);
  }
  .hero .pick-wrap .btn-primary{
    font-size:clamp(10px, 0.85cqw, 14px);
    padding:clamp(6px,0.65cqw,11px) clamp(12px,1.3cqw,22px);
  }

  /* ================= LIBRARY + READER (flowing pages) ================= */
  .page{
    max-width:880px;
    margin:0 auto;
    padding:22px 20px 60px;
  }
  .page.wide{ max-width:1180px; }
  .page-top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:24px;
  }
  .crumbs{
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
    font-size:13.5px; font-weight:500; color:var(--ink-soft);
  }
  .crumbs a{ color:var(--evergreen); font-weight:600; text-decoration:none; }
  .crumbs a:hover{ color:var(--gold-deep); }
  .crumbs a:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:4px; }
  .crumbs .sep{ opacity:.5; }

  .lib-head{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin-bottom:20px;
  }
  .lib-head .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); margin:0 0 6px;
  }
  .lib-head h1{ font-family:'Fraunces',serif; font-size:38px; font-weight:600; color:var(--evergreen); margin:0 0 6px; }
  .lib-head .blurb{ margin:0; color:var(--ink-soft); font-size:14px; }

  .story-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  .story-row{
    display:flex; align-items:center; gap:14px;
    padding:12px 16px 12px 12px;
    background:var(--cream-card);
    border-radius:14px;
    border:1px solid rgba(199,164,103,0.55);
    box-shadow:0 4px 14px rgba(42,30,20,0.08);
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .story-row:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(42,30,20,0.14); border-color:var(--accent); }
  .row-main{
    appearance:none; -webkit-appearance:none;
    flex:1; min-width:0;
    display:flex; align-items:center; gap:14px;
    background:none; border:none; padding:0;
    font:inherit; color:inherit; text-align:left;
    cursor:pointer;
  }
  .row-main:focus-visible{ outline:2px solid var(--gold); outline-offset:4px; border-radius:8px; }
  .row-thumb{
    width:64px; height:64px; flex-shrink:0;
    border-radius:10px; overflow:hidden;
    background:color-mix(in srgb, var(--accent) 14%, var(--cream));
  }
  .row-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .row-text{ min-width:0; }
  .row-num{ font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--accent); }
  .row-title{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--ink); margin:2px 0; }
  .row-meta{ font-size:12.5px; color:var(--ink-soft); }
  .row-play{
    appearance:none; -webkit-appearance:none;
    width:44px; height:44px; flex-shrink:0;
    border-radius:50%; border:none;
    background:var(--evergreen); color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .18s ease, filter .18s ease;
  }
  .row-play svg{ width:40%; height:40%; margin-left:2px; }
  .row-play:hover{ transform:scale(1.08); filter:brightness(1.15); }
  .row-play:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ---------- reader ---------- */
  .reader{
    display:grid;
    grid-template-columns:minmax(0, 1fr) 300px;
    gap:24px;
    align-items:start;
  }
  .panel{
    background:var(--cream-card);
    border-radius:16px;
    border:1px solid rgba(199,164,103,0.55);
    box-shadow:0 8px 24px rgba(42,30,20,0.12);
  }
  .story-panel{ padding:30px 36px 36px; }
  .story-panel .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); margin:0 0 8px; text-align:center;
  }
  .story-panel h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:34px; line-height:1.15;
    color:var(--evergreen); text-align:center; margin:0 0 20px; text-wrap:balance;
  }
  .story-illustration{
    display:flex; justify-content:center;
    margin:0 0 26px;
    padding:14px;
    border-radius:12px;
    background:color-mix(in srgb, var(--accent) 10%, var(--cream));
  }
  .story-illustration img{ max-width:100%; max-height:380px; border-radius:8px; display:block; }
  .story-text p{
    font-family:'Fraunces', Georgia, serif;
    font-size:18px; line-height:1.75;
    color:var(--ink);
    margin:0 0 1em;
  }
  .story-text .s{
    border-radius:4px;
    cursor:pointer;
    transition:background-color .25s ease;
    box-decoration-break:clone; -webkit-box-decoration-break:clone;
  }
  .story-text .s:hover{ background:rgba(243,221,168,0.45); }
  .story-text .s.current{ background:var(--highlight); }
  .story-note{
    margin:6px 0 18px; padding:12px 16px;
    border-left:3px solid var(--gold);
    background:rgba(199,164,103,0.12);
    border-radius:0 10px 10px 0;
  }
  .story-note p{ font-size:15.5px; margin:0; }
  .story-note .label, .story-lesson .label{
    display:block; margin-bottom:4px;
    font-family:'Sora',sans-serif; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--gold-deep);
  }
  .story-lesson{
    margin-top:26px; padding:18px 22px;
    text-align:center;
    border-top:1px solid rgba(199,164,103,0.6);
    border-bottom:1px solid rgba(199,164,103,0.6);
  }
  .story-lesson p{ font-style:italic; font-size:18px; margin:0; }

  .narration-panel{
    position:sticky; top:20px;
    padding:18px;
    display:flex; flex-direction:column; gap:12px;
  }
  .narration-panel .grandmother-mascot{
    width:100%;
    aspect-ratio:1;
    transition:box-shadow .4s ease;
  }
  .narration-panel .grandmother-mascot.is-speaking{
    box-shadow:0 0 0 3px var(--gold), 0 0 0 8px rgba(199,164,103,0.25);
    animation:gm-breathe 2.4s ease-in-out infinite;
  }
  @keyframes gm-breathe{
    0%,100%{ box-shadow:0 0 0 3px var(--gold), 0 0 0 6px rgba(199,164,103,0.22); }
    50%    { box-shadow:0 0 0 3px var(--gold), 0 0 0 12px rgba(199,164,103,0.10); }
  }
  .narr-caption{
    margin:0; text-align:center;
    font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:var(--ink-soft);
  }
  .narr-btn{
    appearance:none; -webkit-appearance:none;
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:12px 16px;
    border-radius:999px;
    font-family:'Sora',sans-serif; font-size:14px; font-weight:600;
    cursor:pointer;
    transition:transform .18s ease, filter .18s ease, border-color .18s ease, background .18s ease;
  }
  .narr-btn svg{ width:1.05em; height:1.05em; }
  .narr-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .narr-btn.play{
    border:1px solid var(--gold);
    background:var(--evergreen); color:var(--cream);
    box-shadow:0 6px 18px rgba(31,59,46,0.22);
  }
  .narr-btn.play:hover{ transform:translateY(-1px); filter:brightness(1.12); }
  .narr-btn.speed{
    border:1px solid rgba(42,36,30,0.16);
    background:var(--cream); color:var(--ink);
  }
  .narr-btn.speed:hover{ border-color:var(--gold); background:#FFFBF0; }
  .narr-btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; filter:none; }
  .narr-notice{
    margin:0; padding:10px 12px;
    border-radius:10px;
    background:rgba(168,64,46,0.08);
    border:1px solid rgba(168,64,46,0.25);
    font-size:12.5px; line-height:1.5; color:var(--brick);
  }
  .narr-notice[hidden]{ display:none; }
  .narr-voice{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:0; font-size:11.5px; color:var(--ink-soft);
  }
  .narr-voice[hidden]{ display:none; }
  .narr-voice select{
    max-width:180px;
    padding:4px 8px;
    border-radius:8px;
    border:1px solid rgba(42,36,30,0.16);
    background:var(--cream);
    font-family:'Sora',sans-serif; font-size:11.5px; color:var(--ink);
    cursor:pointer;
  }
  .narr-voice select:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  @media (prefers-reduced-motion:reduce){
    .cat-card, .story-row{ transition:none; }
    .narration-panel .grandmother-mascot.is-speaking{ animation:none; }
  }

  /* ---------- narrow screens ---------- */
  @media (max-width:900px){
    .reader{ grid-template-columns:1fr; }
    /* controls ride along at the top while the story scrolls */
    .narration-panel{
      position:sticky; top:8px; z-index:5;
      order:-1;
      display:grid;
      grid-template-columns:72px 1fr 1fr;
      grid-template-areas:"gm play speed" "voice voice voice" "notice notice notice";
      column-gap:10px; row-gap:0;
      align-items:center;
      padding:10px;
    }
    .narration-panel .grandmother-mascot{ grid-area:gm; width:72px; aspect-ratio:1; }
    .narration-panel .grandmother-mascot .gm-placeholder span{ display:none; }
    .narr-btn.play{ grid-area:play; }
    .narr-btn.speed{ grid-area:speed; }
    .narr-notice{ grid-area:notice; margin-top:10px; }
    .narr-caption{ display:none; }
    .narr-voice{ grid-area:voice; justify-content:flex-start; margin-top:10px; }
    .story-panel{ padding:24px 20px 28px; }
    .story-panel h1{ font-size:28px; }
    .story-text p{ font-size:17px; }
  }
  @media (max-width:760px){
    .hero.view.active{ width:100%; }
    .hero .bg{ width:100%; max-width:none; max-height:none; height:28vh; min-height:150px; object-fit:cover; object-position:center 35%; }
    .hero-content{ position:static; container-type:normal; display:flex; flex-direction:column; }
    .hero .header-controls{ position:static; justify-content:flex-end; padding:14px 16px 0; }
    .hero .home-link{ top:calc(max(28vh, 150px) + 14px); left:16px; }
    .hero .pill-lang{ font-size:13px; }
    .hero .avatar{ width:36px; height:36px; font-size:14px; }
    .header-block{ position:static; transform:none; padding:6px 16px 4px; }
    .masthead{ font-size:34px; }
    .narrator{
      position:static; width:auto;
      flex-direction:row-reverse; justify-content:center; align-items:center;
      padding:8px 16px 0; gap:12px;
    }
    .narrator .grandmother-mascot{ width:84px; flex-shrink:0; }
    .narrator .grandmother-mascot .gm-placeholder span{ display:none; }
    .speech{ font-size:14px; max-width:240px; }
    .speech::after{ left:auto; right:-7px; bottom:50%; transform:translateY(50%) rotate(-45deg); }
    .cards-block{ position:static; transform:none; width:100%; max-width:520px; margin:18px auto 0; padding:0 16px 40px; }
    .grid{ grid-template-columns:1fr 1fr; gap:14px; }
    .cat-card{ border-radius:14px; border-width:2px; }
    .cat-card:hover{ transform:translateY(-4px); }
    .cat-card .illustration{ border-radius:12px 12px 0 0; aspect-ratio:16/10; }
    .cat-card .card-body{ padding:10px 10px 14px; }
    .card-eyebrow{ font-size:10px; margin-bottom:3px; }
    .cat-card h2{ font-size:17px; }
    .pick-wrap{ margin-top:22px; }
    .hero .pick-wrap .btn-primary{ font-size:14px; padding:11px 22px; }
    .lib-head h1{ font-size:30px; }
    .row-thumb{ width:52px; height:52px; }
    .row-title{ font-size:17px; }
  }
</style>
</head>
<body>

<template id="grandmother-tpl">

<script src="folktales/stories.js"></script>
<script src="folktales/audio.js"></script>
<script>
/* ---------------- categories (spec §8.2, in order) ---------------- */
const CATEGORIES = [
  { slug:'tenali-ramakrishna',      name:'Tenali Ramakrishna',      accent:'var(--brick)',     blurb:'The quick wit of the Vijayanagara court.' },
  { slug:'vikram-bhetal',           name:'Vikram Bhetal',           accent:'var(--plum)',      blurb:'A patient king, a restless ghost, and a riddle at the end of every tale.' },
  { slug:'panchatantra',            name:'Panchatantra',            accent:'var(--navy)',      blurb:'Animal fables on living wisely.' },
  { slug:'paramanandayya-sishyulu', name:'Paramanandayya Sishyulu', accent:'var(--gold-deep)', blurb:'A gentle guru and his seven very literal disciples.' },
  { slug:'freedom-fighter',         name:'Freedom Fighter',         accent:'var(--evergreen)', blurb:'Courage and quick thinking from India’s freedom struggle.' },
  { slug:'festival-stories',        name:'Festival Stories',        accent:'var(--rose)',      blurb:'The stories behind the festivals we celebrate.' },
];
const catBySlug = Object.fromEntries(CATEGORIES.map(c => [c.slug, c]));
const LANG = 'en'; // the Languages switcher isn't wired up yet; only English text exists

const storiesOf = slug => (window.FOLKTALES && window.FOLKTALES[slug]) || [];
const textOf = story => story.text[LANG] || Object.values(story.text)[0];
const wordCount = t => [...t.paragraphs, t.note || '', t.lesson || ''].join(' ').split(/\s+/).filter(Boolean).length;
const minutesOf = story => Math.max(1, Math.round(wordCount(textOf(story)) / 130));

/* ---------------- icons ---------------- */
const ICON = {
  play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></svg>',
  again: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
  speed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-4"/><path d="M3.3 16a9 9 0 1 1 17.4 0"/></svg>',
};

/* ---------------- Grandmother placeholder ---------------- */
document.querySelectorAll('[data-grandmother]').forEach(slot => {
  const node = document.getElementById('grandmother-tpl').content.firstElementChild.cloneNode(true);
  const img = node.querySelector('img');
  img.addEventListener('error', () => { node.classList.add('no-img'); img.remove(); });
  slot.replaceWith(node);
});
const readerGrandmother = document.querySelector('.narration-panel .grandmother-mascot');

/* ---------------- Categories view ---------------- */
const catGrid = document.getElementById('cat-grid');
CATEGORIES.forEach(cat => {
  const stories = storiesOf(cat.slug);
  const cover = stories.find(s => s.image);
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'cat-card';
  card.style.setProperty('--accent', cat.accent);
  card.innerHTML = `
    <div class="illustration">${cover ? `<img src="${cover.image}" alt="">` : ''}</div>
    <div class="card-body">
      <p class="card-eyebrow">${stories.length} ${stories.length === 1 ? 'story' : 'stories'}</p>
      <h2></h2>
    </div>`;
  card.querySelector('h2').textContent = cat.name;
  card.addEventListener('click', () => { location.hash = `#/c/${cat.slug}`; });
  catGrid.appendChild(card);
});

const randomOf = arr => arr[Math.floor(Math.random() * arr.length)];
let lastPicked = null;
function pickFrom(pool){
  if (!pool.length) return;
  const choices = pool.length > 1 ? pool.filter(s => s.id !== lastPicked) : pool;
  const story = randomOf(choices);
  lastPicked = story.id;
  autoplayNext = true;
  location.hash = `#/s/${story.id}`;
}
document.getElementById('pick-any').addEventListener('click', () => {
  // spec §8.2: picks across all categories
  pickFrom(CATEGORIES.flatMap(c => storiesOf(c.slug)));
});

/* ---------------- Library view ---------------- */
let currentCat = null;
function renderLibrary(slug){
  const cat = catBySlug[slug];
  currentCat = cat;
  const view = document.getElementById('view-library');
  view.style.setProperty('--accent', cat.accent);
  document.getElementById('lib-crumb').textContent = cat.name;
  document.getElementById('lib-eyebrow').textContent = cat.name;
  document.getElementById('lib-blurb').textContent = cat.blurb;

  const list = document.getElementById('story-list');
  list.innerHTML = '';
  storiesOf(slug).forEach((story, i) => {
    const t = textOf(story);
    const li = document.createElement('li');
    li.className = 'story-row';
    li.innerHTML = `
      <button class="row-main" type="button">
        <div class="row-thumb">${story.image ? `<img src="${story.image}" alt="">` : ''}</div>
        <div class="row-text">
          <div class="row-num">${String(i + 1).padStart(2, '0')}</div>
          <div class="row-title"></div>
          <div class="row-meta">About ${minutesOf(story)} min listen</div>
        </div>
      </button>
      <button class="row-play" type="button">${ICON.play}</button>`;
    li.querySelector('.row-title').textContent = t.title;
    li.querySelector('.row-play').setAttribute('aria-label', `Listen to ${t.title}`);
    li.querySelector('.row-main').addEventListener('click', () => { location.hash = `#/s/${story.id}`; });
    li.querySelector('.row-play').addEventListener('click', () => { autoplayNext = true; location.hash = `#/s/${story.id}`; });
    list.appendChild(li);
  });
  document.title = `${cat.name} — Folktales`;
}
document.getElementById('pick-in-cat').addEventListener('click', () => {
  if (currentCat) pickFrom(storiesOf(currentCat.slug));
});

/* ---------------- Reader view ---------------- */
const segmenter = 'Segmenter' in Intl ? new Intl.Segmenter('en', { granularity:'sentence' }) : null;
const splitSentences = text => segmenter
  ? [...segmenter.segment(text)].map(s => s.segment.trim()).filter(Boolean)
  : (text.match(/[^.!?]+[.!?]+[”’"')]*|[^.!?]+$/g) || [text]).map(s => s.trim()).filter(Boolean);

function renderReader(id){
  const [slug] = id.split('/');
  const cat = catBySlug[slug];
  const story = storiesOf(slug).find(s => s.id === id);
  if (!cat || !story) { location.hash = '#/'; return; }
  const t = textOf(story);

  document.getElementById('view-reader').style.setProperty('--accent', cat.accent);
  const crumb = document.getElementById('reader-crumb');
  crumb.textContent = cat.name;
  crumb.href = `#/c/${slug}`;

  // narration chunks: title, then each sentence, then the note and lesson
  const chunks = [];
  const sentenceSpans = (text, gapAfter) => splitSentences(text).map((s, i, all) => {
    chunks.push({ text:s, gap: i === all.length - 1 ? gapAfter : 260 });
    return `<span class="s" data-i="${chunks.length - 1}">${escapeHTML(s)}</span>`;
  }).join(' ');

  const panel = document.getElementById('story-panel');
  let html = `<p class="eyebrow">${escapeHTML(cat.name)}</p>`;
  html += `<h1>${sentenceSpans(t.title, 900)}</h1>`;
  if (story.image) html += `<div class="story-illustration"><img src="${story.image}" alt="Illustration for ${escapeHTML(t.title)}"></div>`;
  html += '<div class="story-text">';
  t.paragraphs.forEach(p => { html += `<p>${sentenceSpans(p, 650)}</p>`; });
  if (t.note) html += `<div class="story-note"><span class="label">Did you know?</span><p>${sentenceSpans(t.note, 650)}</p></div>`;
  if (t.lesson) {
    chunks.push({ text:'And the lesson of this story…', gap:500, silent:true });
    html += `<div class="story-lesson"><span class="label">What the story teaches</span><p>${sentenceSpans(t.lesson, 0)}</p></div>`;
  }
  html += '</div>';
  panel.innerHTML = html;

  panel.querySelectorAll('.s').forEach(el => {
    el.addEventListener('click', () => narrator.playFrom(+el.dataset.i));
  });

  narrator.load(chunks);
  document.title = `${t.title} — Folktales`;
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

/* ---------------- Narration (Web Speech API, spec §8.5) ----------------
   Spoken one sentence at a time: Chrome silently stops long utterances after
   ~15s, and speechSynthesis.pause() is unreliable across browsers. Chunking
   lets pause/resume and speed changes restart cleanly at the current sentence,
   and gives the short breaths between sentences that make it sound unhurried. */
const SPEEDS = [0.75, 1, 1.25, 1.5];
const BASE_RATE = 0.88;   // a touch slower than default — gentle, unhurried
const BASE_PITCH = 1.0;
const LANG_CODES = { en:'en-IN', hi:'hi-IN', te:'te-IN', ta:'ta-IN', kn:'kn-IN', ml:'ml-IN' };
const WARM_VOICES = ['neerja','veena','heera','isha','kajal','ananya','aashi','swara','lekha','kalpana','shruti','pallavi','sapna','sobhana','vani'];
const MALE_VOICES = ['rishi','ravi','prabhat','madhur','hemant','mohan','valluvar','gagan','midhun','aarav','kunal','rehaan','arjun'];
const FALLBACK_EN_FEMALE = ['samantha','karen','moira','tessa','serena','fiona','female','zira','aria','jenny','sonia','libby'];
let autoplayNext = false;

/* Pre-recorded Sarvam narration (folktales/narrate.mjs), keyed by sentence text.
   A story plays from these clips only when every one of its sentences has one, so
   Grandmother never switches voice mid-story; otherwise the browser voice below is used. */
const RECORDED = (window.FOLKTALES_AUDIO && window.FOLKTALES_AUDIO.files) || {};

const narrator = {
  audio: new Audio(), nextAudio: new Audio(), audioMode: false, audioIndex: -1,
  supported: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  chunks: [], index: 0, state: 'idle', speedIdx: 1, token: 0, voice: null, utterance: null, timer: null,
  dog: null, badVoices: new Set(), chosenName: null,

  // every usable voice for this language, best first
  rankVoices(){
    if (!this.supported) return [];
    const voices = speechSynthesis.getVoices();
    const code = LANG_CODES[LANG].toLowerCase();
    const has = (v, names) => names.some(n => v.name.toLowerCase().includes(n));
    const score = v => (has(v, WARM_VOICES) ? 4 : 0)
      + (/natural|online|enhanced|premium/i.test(v.name) ? 2 : 0)
      - (has(v, MALE_VOICES) ? 6 : 0);
    let pool = voices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(code));
    // always an Indian voice when one exists — score() already puts female ones
    // (Veena, Neerja, …) ahead of male ones like Rishi. Only if the device has no
    // Indian voice at all does it fall back to another English voice below.
    if (!pool.length && LANG === 'en') {
      pool = voices.filter(v => v.lang.toLowerCase().startsWith('en'));
      const warm = pool.filter(v => has(v, FALLBACK_EN_FEMALE));
      if (warm.length) pool = warm;
    }
    return pool.sort((a, b) => score(b) - score(a));
  },

  pickVoice(){
    const ranked = this.rankVoices();
    const chosen = this.chosenName && ranked.find(v => v.name === this.chosenName && !this.badVoices.has(v.name));
    return chosen || ranked.find(v => !this.badVoices.has(v.name)) || null;
  },

  // a voice object from before a voiceschanged event can go dead in Chrome — always speak with the live one
  liveVoice(){
    return speechSynthesis.getVoices().find(v => v.name === this.voice.name) || this.voice;
  },

  // Chrome on macOS lists some voices (often the "Enhanced" downloads) that then never start
  // speaking and never report an error. If a sentence hasn't started within a few seconds,
  // drop that voice and carry on with the next best one.
  skipBrokenVoice(i){
    const broken = this.voice.name;
    this.badVoices.add(broken);
    if (this.chosenName === broken) this.chosenName = null;
    this.cancelSpeech();
    this.voice = this.pickVoice();
    if (!this.voice) {
      this.state = 'paused';
      this.render();
      this.showNotice(`“${prettyVoice(broken)}” didn’t speak in this browser, and no other voice is available. You can still read the story here.`);
      return;
    }
    this.state = 'playing';
    this.render();
    this.showNotice(`“${prettyVoice(broken)}” didn’t speak in this browser, so Grandmother is using “${prettyVoice(this.voice.name)}” instead.`);
    const token = this.token;
    this.timer = setTimeout(() => this.speak(i, token), 120);
  },

  load(chunks){
    this.stop();
    this.chunks = chunks;
    this.index = 0;
    this.state = 'idle';
    this.voice = this.pickVoice();
    this.audioMode = chunks.length > 0 && chunks.every(c => RECORDED[c.text]);
    this.audioIndex = -1;
    this.render();
    if (autoplayNext) { autoplayNext = false; this.play(); }
  },

  play(){
    // recorded clips can pick up mid-sentence; the browser voice restarts the sentence
    if (this.audioMode && this.state === 'paused' && this.audioIndex === this.index && this.audio.currentTime > 0 && !this.audio.ended) {
      this.state = 'playing';
      this.render();
      this.playClip(this.index, this.token, true);
      return;
    }
    this.playFrom(this.state === 'done' ? 0 : this.index);
  },

  playFrom(i){
    if (!this.audioMode && (!this.supported || !this.voice)) { this.render(); return; }
    this.cancelSpeech();
    this.index = i;
    this.state = 'playing';
    const token = this.token;
    this.render();
    // Chrome sometimes drops a speak() issued in the same tick as cancel()
    this.timer = setTimeout(() => this.speak(i, token), 80);
  },

  speak(i, token){
    if (token !== this.token) return;
    if (i >= this.chunks.length) { this.state = 'done'; this.index = 0; this.highlight(-1); this.render(); return; }
    const chunk = this.chunks[i];
    this.index = i;
    this.highlight(chunk.silent ? -1 : i);
    if (this.audioMode) { this.playClip(i, token, false); return; }
    const voice = this.liveVoice();
    const u = new SpeechSynthesisUtterance(chunk.text);
    u.voice = voice;
    u.lang = voice.lang;
    u.rate = BASE_RATE * SPEEDS[this.speedIdx];
    u.pitch = BASE_PITCH;
    let finished = false;
    const next = () => {
      if (finished || token !== this.token) return;
      finished = true;
      clearTimeout(this.dog);
      this.timer = setTimeout(() => this.speak(i + 1, token), chunk.gap / SPEEDS[this.speedIdx]);
    };
    clearTimeout(this.dog);
    this.dog = setTimeout(() => { if (token === this.token) this.skipBrokenVoice(i); }, 3000);
    u.onstart = () => {
      if (token !== this.token) return;
      clearTimeout(this.dog);
      // Chrome occasionally never fires onend; don't let that stall the story
      const expectedMs = chunk.text.length * 90 / u.rate + 4000;
      this.dog = setTimeout(next, expectedMs);
    };
    u.onend = next;
    u.onerror = e => {
      if (token !== this.token || e.error === 'interrupted' || e.error === 'canceled') return;
      clearTimeout(this.dog);
      if (['synthesis-failed', 'synthesis-unavailable', 'voice-unavailable', 'language-unavailable'].includes(e.error)) {
        this.skipBrokenVoice(i);
        return;
      }
      this.state = 'paused';
      this.showNotice('Grandmother’s voice stopped unexpectedly. Press Resume to carry on, or keep reading below.');
      this.render();
    };
    this.utterance = u; // keep a reference so Chrome doesn't garbage-collect it mid-sentence
    speechSynthesis.speak(u);
  },

  playClip(i, token, resume){
    const a = this.audio;
    const chunk = this.chunks[i];
    const advance = delay => { this.timer = setTimeout(() => this.speak(i + 1, token), delay); };
    if (!resume) { a.src = RECORDED[chunk.text]; this.audioIndex = i; }
    a.playbackRate = SPEEDS[this.speedIdx];
    a.onended = () => { if (token === this.token) advance(chunk.gap / SPEEDS[this.speedIdx]); };
    a.onerror = () => { if (token === this.token) advance(200); }; // a missing clip shouldn't stop the story
    a.play().catch(err => {
      if (token !== this.token || err.name === 'AbortError') return;
      if (err.name === 'NotAllowedError') { // autoplay blocked — wait for a tap on Listen
        this.state = 'paused';
        this.render();
      } else advance(200);
    });
    const upcoming = this.chunks[i + 1];
    if (upcoming) { this.nextAudio.src = RECORDED[upcoming.text]; this.nextAudio.preload = 'auto'; }
  },

  pause(){
    this.cancelSpeech();
    this.state = 'paused';
    this.render();
  },

  stop(){
    this.cancelSpeech();
    this.state = 'idle';
    this.highlight(-1);
  },

  cancelSpeech(){
    this.token++;
    clearTimeout(this.timer);
    clearTimeout(this.dog);
    this.audio.pause();
    if (this.supported) speechSynthesis.cancel();
  },

  cycleSpeed(){
    this.speedIdx = (this.speedIdx + 1) % SPEEDS.length;
    if (this.audioMode) { this.audio.playbackRate = SPEEDS[this.speedIdx]; this.render(); return; }
    if (this.state === 'playing') this.playFrom(this.index); // restart the current sentence at the new pace
    else this.render();
  },

  highlight(i){
    document.querySelectorAll('.story-text .s.current, .story-panel h1 .s.current').forEach(el => el.classList.remove('current'));
    if (i < 0) return;
    const el = document.querySelector(`#story-panel .s[data-i="${i}"]`);
    if (!el) return;
    el.classList.add('current');
    const r = el.getBoundingClientRect();
    if (r.top < 90 || r.bottom > window.innerHeight - 40) el.scrollIntoView({ block:'center', behavior:'smooth' });
  },

  renderVoicePicker(){
    const wrap = document.getElementById('narr-voice');
    const ranked = this.rankVoices().filter(v => !this.badVoices.has(v.name));
    if (this.audioMode || !ranked.length || !this.voice) { wrap.hidden = true; return; }
    wrap.hidden = false;
    const sel = document.getElementById('voice-select');
    sel.innerHTML = '';
    ranked.forEach(v => {
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = prettyVoice(v.name, true);
      o.selected = v.name === this.voice.name;
      sel.appendChild(o);
    });
  },

  chooseVoice(name){
    this.chosenName = name;
    this.voice = this.pickVoice();
    this.showNotice('');
    if (this.state === 'playing') this.playFrom(this.index);
    else this.render();
  },

  showNotice(msg){
    const n = document.getElementById('narr-notice');
    n.textContent = msg;
    n.hidden = !msg;
  },

  render(){
    const play = document.getElementById('btn-play');
    const speed = document.getElementById('btn-speed');
    const canSpeak = this.audioMode || (this.supported && !!this.voice);
    const labels = {
      idle:    [ICON.play,  'Listen'],
      playing: [ICON.pause, 'Pause'],
      paused:  [ICON.play,  'Resume'],
      done:    [ICON.again, 'Listen again'],
    };
    const [icon, label] = labels[this.state];
    play.innerHTML = `${icon}<span>${label}</span>`;
    play.disabled = !canSpeak;
    speed.innerHTML = `${ICON.speed}<span>Speed ${SPEEDS[this.speedIdx]}×</span>`;
    speed.disabled = !canSpeak;
    readerGrandmother.classList.toggle('is-speaking', this.state === 'playing');

    // spec §8.5: no voice for this language → text only, with a short notice
    if (this.audioMode) { if (this.state !== 'paused') this.showNotice(''); }
    else if (!this.supported) this.showNotice('This browser can’t read aloud. You can still read the story here.');
    else if (!this.voice) this.showNotice('No voice for this language is installed on this device, so the story is shown as text only.');
    else if (this.state !== 'paused') this.showNotice('');

    this.renderVoicePicker();
  },
};

document.getElementById('btn-play').addEventListener('click', () => {
  narrator.state === 'playing' ? narrator.pause() : narrator.play();
});
document.getElementById('btn-speed').addEventListener('click', () => narrator.cycleSpeed());
document.getElementById('voice-select').addEventListener('change', e => narrator.chooseVoice(e.target.value));

function prettyVoice(name, withLang){
  const short = name.replace(/^(Microsoft|Google)\s+/, '').replace(/\s+Online.*$/, '');
  if (!withLang) return short;
  const v = speechSynthesis.getVoices().find(x => x.name === name);
  return v && !/-IN$/i.test(v.lang.replace('_', '-')) ? `${short} (${v.lang})` : short;
}

if (narrator.supported) {
  // voices load asynchronously in Chrome; re-pick once they arrive
  speechSynthesis.addEventListener('voiceschanged', () => {
    // re-pick whenever the list changes (e.g. a voice was just downloaded), but never mid-sentence
    if (narrator.state === 'playing') return;
    narrator.voice = narrator.pickVoice();
    if (document.getElementById('view-reader').classList.contains('active')) narrator.render();
  });
  window.addEventListener('pagehide', () => speechSynthesis.cancel());
}
window.addEventListener('pagehide', () => narrator.audio.pause());

/* ---------------- routing: #/  ·  #/c/<category>  ·  #/s/<category>/<story> ---------------- */
function showView(id){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id));
  window.scrollTo({ top:0 });
}
function route(){
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] !== 's') narrator.stop();
  if (parts[0] === 'c' && catBySlug[parts[1]]) {
    renderLibrary(parts[1]);
    showView('view-library');
  } else if (parts[0] === 's' && parts.length >= 3) {
    renderReader(`${parts[1]}/${parts.slice(2).join('/')}`);
    showView('view-reader');
  } else {
    document.title = 'KREEDA — Folktales';
    showView('view-categories');
  }
}
window.addEventListener('hashchange', route);
route();
</script>
