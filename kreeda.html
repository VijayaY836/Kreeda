<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KREEDA — Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fraunces:opsz,wght@9..144,400..700&family=Marcellus&family=Sora:wght@400;500;600;700&family=Tiro+Telugu&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="assets/world-atlas.js"></script>
  <script src="js/vaikunthapali-map.js"></script>
  <script src="js/puli-meka-map.js"></script>
  <script src="js/daadi-aata-map.js"></script>
  <script src="js/ashta-chamma-map.js"></script>
  <script src="js/chaturangam-map.js"></script>
  <script src="js/vamana-guntalu-map.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #2A241E;
      --ink-soft: #5C5142;
      --navy: #1F3A5C;
      --gold-deep: #C4881F;
      --brick: #A8402E;
      --evergreen: #1F3B2E;
      --rose: #C0524A;
      --plum: #4A3558;
      --gold: #C7A467;
      --cream-card: #F6EFDE;
      --cream: #FBF3E2;
      --page-bg: #F1E8D2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--ink);
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .telugu {
      font-family: 'Tiro Telugu', serif;
    }

    .font-cartography {
      font-family: 'Cinzel', 'Marcellus', Georgia, serif;
    }

    .font-antique {
      font-family: 'Marcellus', Georgia, serif;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* ---------- shared header controls ---------- */
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-lang {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(42, 36, 30, 0.16);
      background: rgba(251, 243, 226, 0.9);
      color: var(--ink);
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }

    .pill-lang:hover {
      border-color: var(--gold);
      background: #FFFBF0;
    }

    .pill-lang:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .pill-lang svg {
      width: 1em;
      height: 1em;
      opacity: .7;
    }

    .pill-lang .chev {
      width: .7em;
      height: .7em;
      opacity: .55;
    }

    .avatar {
      appearance: none;
      -webkit-appearance: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--evergreen);
      border: 1px solid var(--gold);
      color: var(--cream);
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: filter .18s ease;
    }

    .avatar:hover {
      filter: brightness(1.15);
    }

    .avatar:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* ================= GAMES VIEW =================
     Same pinned-illustration hero as kreeda-home.html: the image is capped by
     both viewport dimensions and the content is laid over it. Sizes inside use
     cqw (1% of the hero's rendered width) so the 2x3 grid scales with the
     frame whether the image is width- or height-limited. */
    .hero.view.active {
      position: relative;
      display: block;
      width: fit-content;
      margin: 0 auto;
      line-height: 0;
    }

    .hero .bg {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
    }

    .hero-content {
      position: absolute;
      inset: 0;
      line-height: normal;
      container-type: size;
    }

    .hero .header-controls {
      position: absolute;
      top: 4.8%;
      right: 2.5%;
    }

    .hero .home-link {
      position: absolute;
      top: 4.8%;
      left: 2.5%;
      text-decoration: none;
    }

    .hero .pill-lang {
      font-size: clamp(10px, 0.8cqw, 13px);
    }

    .hero .avatar {
      width: clamp(26px, 2.4cqw, 40px);
      height: clamp(26px, 2.4cqw, 40px);
      font-size: clamp(10px, 0.85cqw, 14px);
    }

    .header-block {
      position: absolute;
      left: 50%;
      top: 7%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
    }

    .masthead {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: clamp(20px, 3.2cqw, 52px);
      letter-spacing: 0.01em;
      color: var(--evergreen);
      margin: 0;
    }

    .cards-block {
      position: absolute;
      left: 50%;
      top: 19%;
      transform: translateX(-50%);
      width: 76%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      column-gap: 3.2cqw;
      row-gap: 2.2cqw;
    }

    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--cream-card);
      border-radius: clamp(6px, 0.9cqw, 16px);
      border: clamp(1px, 0.14cqw, 2.5px) solid var(--accent);
      box-shadow: 0 clamp(2px, 0.5cqw, 10px) clamp(6px, 1.4cqw, 26px) rgba(42, 30, 20, 0.22);
      cursor: pointer;
      transition: transform .22s ease, box-shadow .22s ease;
    }

    .game-card:hover {
      transform: translateY(clamp(-8px, -0.45cqw, -3px));
      box-shadow: 0 clamp(4px, 0.9cqw, 16px) clamp(10px, 2.2cqw, 38px) rgba(42, 30, 20, 0.28);
    }

    @media (prefers-reduced-motion:reduce) {
      .game-card {
        transition: none;
      }
    }

    /* no per-game artwork yet — a tinted plate with the game's motif stands in
     for the illustration slot the landing-page cards use */
    .plate {
      width: 100%;
      aspect-ratio: 3/1;
      border-radius: clamp(5px, 0.8cqw, 14px) clamp(5px, 0.8cqw, 14px) 0 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(color-mix(in srgb, var(--accent) 22%, transparent) 1px, transparent 1.4px) 0 0 / 12px 12px,
        color-mix(in srgb, var(--accent) 14%, var(--cream));
      color: var(--accent);
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .plate svg {
      width: clamp(20px, 3.2cqw, 54px);
      height: auto;
    }

    .plate img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .card-body {
      padding: clamp(4px, 0.8cqw, 16px) clamp(4px, 1cqw, 18px) clamp(5px, 0.9cqw, 16px);
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-eyebrow {
      font-size: clamp(5.5px, 0.56cqw, 10px);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 clamp(2px, 0.25cqw, 5px);
    }

    .game-card h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: clamp(9px, 1.35cqw, 23px);
      line-height: 1.1;
      margin: 0 0 clamp(2px, 0.3cqw, 6px);
      color: var(--ink);
    }

    .game-card .native {
      font-size: clamp(5.5px, 0.62cqw, 12px);
      line-height: 1.45;
      color: var(--ink-soft);
      margin: 0;
    }

    .card-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 0.6cqw, 12px);
      margin-top: auto;
      padding-top: clamp(4px, 0.6cqw, 12px);
    }

    .flourish-line {
      width: clamp(10px, 2.2cqw, 42px);
      height: 1px;
      background: var(--gold);
      opacity: 0.8;
    }

    .arrow-btn {
      appearance: none;
      -webkit-appearance: none;
      width: clamp(14px, 2.1cqw, 36px);
      height: clamp(14px, 2.1cqw, 36px);
      border-radius: 50%;
      border: none;
      background: var(--evergreen);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform .18s ease, filter .18s ease;
    }

    .arrow-btn svg {
      width: 38%;
      height: 38%;
    }

    .arrow-btn:hover {
      transform: scale(1.08);
      filter: brightness(1.15);
    }

    .arrow-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* ================= DETAIL + PLAY VIEWS ================= */
    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 22px 20px 60px;
    }

    .page-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .backbtn {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 0;
      color: var(--evergreen);
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 14px;
    }

    .backbtn:hover {
      color: var(--gold-deep);
    }

    .backbtn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ================= GAME SCREEN =================
     Same pinned illustration as the Games view. Left: name + actions;
     right: map with the game's journey and a facts panel. */
    .detail-shell {
      position: absolute;
      left: 6.5%;
      right: 6.5%;
      top: 14cqh;
      height: 58cqh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
      gap: 2.6cqw;
    }

    .detail-card {
      background: rgba(246, 239, 222, 0.94);
      border-radius: clamp(8px, 1cqw, 18px);
      border: clamp(1px, 0.14cqw, 2.5px) solid var(--accent);
      box-shadow: 0 clamp(3px, 0.6cqw, 12px) clamp(8px, 1.6cqw, 30px) rgba(42, 30, 20, 0.24);
      min-height: 0;
    }

    .detail-left {
      display: flex;
      flex-direction: column;
      padding: clamp(10px, 1.6cqw, 30px) clamp(10px, 1.8cqw, 34px);
      gap: clamp(5px, 0.75cqw, 13px);
    }

    .detail-eyebrow {
      font-size: clamp(7px, 0.62cqw, 11px);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0;
    }

    .detail-title {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      font-size: clamp(20px, 2.7cqw, 46px);
      line-height: 1.05;
      color: var(--ink);
      margin: 0;
    }

    .detail-native {
      font-size: clamp(8px, 0.72cqw, 13px);
      color: var(--ink-soft);
      margin: 0;
    }

    .detail-blurb {
      font-size: clamp(8px, 0.78cqw, 14px);
      line-height: 1.5;
      color: var(--ink);
      margin: 0 0 auto;
    }

    .mode-toggle {
      display: inline-flex;
      align-self: flex-start;
      gap: 3px;
      padding: 3px;
      border-radius: 999px;
      background: var(--cream);
      border: 1px solid rgba(42, 36, 30, 0.16);
    }

    .mode-toggle button {
      border: none;
      background: none;
      padding: clamp(3px, 0.35cqw, 7px) clamp(9px, 0.9cqw, 16px);
      border-radius: 999px;
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: clamp(8px, 0.7cqw, 12px);
      cursor: pointer;
      color: var(--ink-soft);
      transition: background .18s ease, color .18s ease;
    }

    .mode-toggle button.active {
      background: var(--evergreen);
      color: var(--cream);
    }

    .action-btn {
      appearance: none;
      -webkit-appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(5px, 0.6cqw, 10px);
      width: 100%;
      padding: clamp(6px, 0.8cqw, 14px) 12px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
      background: var(--cream);
      color: var(--ink);
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: clamp(9px, 0.9cqw, 16px);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .action-btn svg {
      width: 1.05em;
      height: 1.05em;
      flex-shrink: 0;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: #FFFBF0;
      box-shadow: 0 6px 16px rgba(42, 30, 20, 0.14);
    }

    .action-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .action-btn.primary {
      background: var(--evergreen);
      color: var(--cream);
      border-color: var(--gold);
      font-family: 'Fraunces', serif;
      font-size: clamp(11px, 1.15cqw, 20px);
      letter-spacing: .02em;
      box-shadow: 0 8px 22px rgba(31, 59, 46, 0.25);
    }

    .action-btn.primary:hover {
      background: var(--evergreen);
      filter: brightness(1.12);
      box-shadow: 0 12px 28px rgba(31, 59, 46, 0.3);
    }

    .difficulty {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(4px, 0.6cqw, 10px);
    }

    .diff-btn {
      appearance: none;
      -webkit-appearance: none;
      padding: clamp(4px, 0.5cqw, 9px) 6px;
      border-radius: 999px;
      border: 1px solid rgba(42, 36, 30, 0.18);
      background: transparent;
      color: var(--ink-soft);
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: clamp(8px, 0.72cqw, 12.5px);
      cursor: pointer;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }

    .diff-btn:hover {
      border-color: var(--accent);
      color: var(--ink);
    }

    .diff-btn[aria-checked="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--cream);
    }

    .diff-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .diff-note {
      font-size: clamp(7px, 0.64cqw, 11.5px);
      color: var(--ink-soft);
      margin: 0;
      min-height: 2.9em;
      line-height: 1.45;
    }

    .difficulty.disabled .diff-btn {
      opacity: .45;
      pointer-events: none;
    }

    .detail-right {
      display: flex;
      flex-direction: column;
      padding: clamp(6px, 0.8cqw, 14px);
      gap: clamp(6px, 0.8cqw, 14px);
      overflow: hidden;
    }

    .map-frame {
      position: relative;
      flex: 0 0 56%;
      border-radius: clamp(6px, 0.7cqw, 12px);
      overflow: hidden;
      background:
        radial-gradient(rgba(251, 243, 226, 0.10) 1px, transparent 1.4px) 0 0 / 14px 14px,
        var(--navy);
    }

    .map-frame svg.paths {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .map-title {
      position: absolute;
      top: clamp(6px, 0.7cqw, 12px);
      left: clamp(8px, 0.9cqw, 14px);
      right: clamp(8px, 0.9cqw, 14px);
      color: var(--cream);
      font-size: clamp(8px, 0.7cqw, 12.5px);
      line-height: 1.4;
      opacity: .9;
    }

    .map-title strong {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.25em;
      display: block;
      opacity: 1;
    }

    .pin {
      appearance: none;
      -webkit-appearance: none;
      background: none;
      border: none;
      padding: 0;
      position: absolute;
      width: clamp(16px, 1.5cqw, 26px);
      height: clamp(21px, 2cqw, 34px);
      transform: translate(-50%, -100%);
      cursor: pointer;
      transition: transform .18s ease;
      transform-origin: 50% 100%;
    }

    .pin svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .pin:hover,
    .pin.active {
      transform: translate(-50%, -100%) scale(1.22);
    }

    .pin:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .map-caption {
      position: absolute;
      bottom: clamp(5px, 0.6cqw, 10px);
      left: clamp(8px, 0.9cqw, 14px);
      color: var(--cream);
      opacity: .75;
      font-size: clamp(7px, 0.62cqw, 11px);
    }

    .facts {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 clamp(4px, 0.5cqw, 8px) clamp(4px, 0.5cqw, 8px);
      scrollbar-width: thin;
      scrollbar-color: var(--gold) transparent;
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent);
    }

    .facts h3 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(11px, 1.15cqw, 20px);
      margin: 0 0 clamp(3px, 0.3cqw, 6px);
      color: var(--ink);
    }

    .fact-place {
      font-size: clamp(7px, 0.6cqw, 10.5px);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      margin: 0;
    }

    .fact-story {
      font-size: clamp(8px, 0.74cqw, 13.5px);
      line-height: 1.55;
      margin: 0 0 clamp(3px, 0.3cqw, 6px);
      color: var(--ink);
    }

    .fact-how {
      font-size: clamp(7.5px, 0.66cqw, 12px);
      line-height: 1.5;
      color: var(--ink-soft);
      margin: 0;
    }

    .did-you-know {
      margin: clamp(8px, 0.8cqw, 14px) 0 0;
      padding: clamp(6px, 0.7cqw, 12px) 0 0;
      border-top: 1px dashed rgba(199, 164, 103, 0.8);
      list-style: none;
    }

    .did-you-know li {
      position: relative;
      padding-left: 1.2em;
      margin-bottom: clamp(4px, 0.45cqw, 8px);
      font-size: clamp(8px, 0.72cqw, 13px);
      line-height: 1.5;
      color: var(--ink);
    }

    .did-you-know li::before {
      content: "";
      position: absolute;
      left: 0;
      top: .55em;
      width: .42em;
      height: .42em;
      background: var(--accent);
      transform: rotate(45deg);
    }

    .did-you-know .dyk-label {
      padding: 0;
      font-size: clamp(7px, 0.6cqw, 10.5px);
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--gold-deep);
    }

    .did-you-know .dyk-label::before {
      display: none;
    }

    /* play placeholder */
    .panel {
      background: var(--cream-card);
      border-radius: 16px;
      border: 1px solid rgba(199, 164, 103, 0.55);
      box-shadow: 0 8px 24px rgba(42, 30, 20, 0.12);
      padding: 24px;
    }

    .play-shell {
      text-align: center;
      padding: 50px 20px;
    }

    .play-shell .mascot {
      width: 130px;
      height: 130px;
      margin: 0 auto 18px;
    }

    .play-shell .mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .play-shell h2 {
      font-family: 'Fraunces', serif;
      font-size: 26px;
      margin: 0 0 6px;
      font-weight: 600;
      color: var(--evergreen);
    }

    .play-shell p {
      color: var(--ink-soft);
      font-size: 14.5px;
      max-width: 420px;
      margin: 0 auto;
    }

    /* modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(42, 36, 30, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      --accent: var(--evergreen);
      background: var(--cream-card);
      border-radius: 18px;
      max-width: 540px;
      width: 100%;
      max-height: min(86vh, 720px);
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid var(--gold);
      border-top: 4px solid var(--accent);
      box-shadow: 0 20px 50px rgba(42, 30, 20, 0.3);
    }

    .modal:focus {
      outline: none;
    }

    .modal-head {
      padding: 24px 26px 10px;
    }

    .modal-body {
      padding: 6px 26px 8px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .modal-foot {
      padding: 14px 26px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px dashed rgba(199, 164, 103, 0.7);
    }

    .modal .close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: none;
      border: 1px solid rgba(42, 36, 30, 0.16);
      cursor: pointer;
      color: var(--ink-soft);
      font-size: 14px;
    }

    .modal .close:hover {
      border-color: var(--gold);
      color: var(--ink);
    }

    .modal .close:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .modal .kicker {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin: 0;
    }

    .modal h3 {
      font-family: 'Fraunces', serif;
      margin: 4px 0 0;
      font-size: 26px;
      font-weight: 600;
      color: var(--ink);
      padding-right: 36px;
    }

    /* tutorial steps */
    .tut-step {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: start;
    }

    .tut-num {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--accent) 14%, var(--cream));
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 20px;
    }

    .tut-step h4 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 20px;
      margin: 4px 0 6px;
      color: var(--ink);
    }

    .tut-step p {
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--ink);
      margin: 0;
    }

    .tut-tip {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--gold) 16%, var(--cream));
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink-soft);
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .tut-tip img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .tut-dots {
      display: flex;
      gap: 6px;
    }

    .tut-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(42, 36, 30, 0.18);
      transition: background .18s ease, transform .18s ease;
    }

    .tut-dots span.on {
      background: var(--accent);
      transform: scale(1.25);
    }

    .tut-nav {
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      appearance: none;
      -webkit-appearance: none;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid rgba(42, 36, 30, 0.18);
      background: var(--cream);
      color: var(--ink);
      transition: border-color .18s ease, filter .18s ease;
    }

    .pill-btn:hover {
      border-color: var(--gold);
    }

    .pill-btn:disabled {
      opacity: .4;
      cursor: default;
    }

    .pill-btn.solid {
      background: var(--evergreen);
      border-color: var(--gold);
      color: var(--cream);
    }

    .pill-btn.solid:hover {
      filter: brightness(1.12);
    }

    .pill-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* rules */
    .rules-section {
      margin-bottom: 16px;
    }

    .rules-section h4 {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 6px;
    }

    .rules-section ul {
      margin: 0;
      padding-left: 18px;
    }

    .rules-section li {
      font-size: 14px;
      line-height: 1.65;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .rules-section li strong {
      color: var(--evergreen);
    }

    .rules-note {
      font-size: 12.5px;
      color: var(--ink-soft);
      margin: 0;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--evergreen);
      color: var(--cream);
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid var(--gold);
      opacity: 0;
      pointer-events: none;
      transition: all .3s ease;
      z-index: 80;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------- narrow screens: collapse the pinned illustration into a normal flowing page ---------- */
    @media (max-width:760px) {
      .hero.view.active {
        width: 100%;
      }

      .game-card h2 {

      .card-cta {

      .flourish-line {

      .arrow-btn {

      .detail-shell {

      .detail-title {

      }

      }

      .action-btn.primary {
        font-size: 18px;
        padding: 14px;
      }

      .diff-btn {

        padding: 8px 6px;
      }

      }

      .detail-right {

      }

      .map-frame {

      }

      .map-title {

      }

      .facts {

      }
    }
  </style>
</head>

    /* ---------------- render games grid ---------------- */
    const arrowSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
    const grid = document.getElementById('game-grid');
    games.forEach(g => {
      const card = document.createElement('article');
      card.className = 'game-card';
      card.style.setProperty('--accent', g.accent);
      card.innerHTML = `
    <div class="plate">${g.image ? `<img src="${g.image}" alt="${g.name}">` : icons[g.icon]}</div>
    <div class="card-body">
      <p class="card-eyebrow">${g.hasSoloMode ? 'Solo or vs Kreedu' : 'vs Kreedu'}</p>
      <h2>${g.name}</h2>
      <p class="native">${g.native}</p>
      <div class="card-cta">
        <span class="flourish-line"></span>
        <button class="arrow-btn" type="button" aria-label="Explore ${g.name}">${arrowSVG}</button>
        <span class="flourish-line"></span>
      </div>
    </div>
  `;
      card.onclick = () => openGame(g.id);
      grid.appendChild(card);
    });

    /* ---------------- navigation ---------------- */
    let currentGame = null;
    let currentMode = 'mascot';
    let currentLevel = 'medium';
    const LEVEL_LABEL = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };

    function showView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function goHome() { closeModal(); showView('view-home'); }
    function goDetail() { showView('view-detail'); }

    function openGame(id) {
      currentGame = games.find(g => g.id === id);
      currentMode = 'mascot';
      renderDetail();
      showView('view-detail');
    }

    /* difficulty is remembered per game, per browser — a convenience only */
    function loadLevel(id) {
      try { const v = localStorage.getItem('kreeda.difficulty.' + id); if (v in LEVEL_LABEL) return v; } catch (e) { }
      return 'medium';
    }
    function saveLevel(id, v) { try { localStorage.setItem('kreeda.difficulty.' + id, v); } catch (e) { } }

    function renderDetail() {
      const g = currentGame;
      const sc = screens[g.id];
      document.getElementById('detail-shell').style.setProperty('--accent', g.accent);
      document.getElementById('d-eyebrow').textContent = g.hasSoloMode ? 'Solo or vs Kreedu' : 'vs Kreedu';
      document.getElementById('d-title').textContent = g.name;
      document.getElementById('d-native').textContent = g.native;
      document.getElementById('d-blurb').textContent = sc.blurb;

      // mode toggle (only games that support solo play)
      const modeArea = document.getElementById('d-mode-area');
      if (g.hasSoloMode) {
        modeArea.innerHTML = `
      <div class="mode-toggle" role="radiogroup" aria-label="Mode">
        <button id="mode-mascot" type="button" role="radio" onclick="setMode('mascot')">vs Kreedu</button>
        <button id="mode-solo" type="button" role="radio" onclick="setMode('solo')">Solo</button>
      </div>`;
      } else {
        modeArea.innerHTML = '';
      }

      // difficulty
      setLevel(loadLevel(g.id));
      if (g.hasSoloMode) setMode('mascot');

      const mapFrame = document.getElementById('map-frame');
      if (g.id === 'vaikunthapali') {
        if (typeof window.initVaikunthapaliWorldMap === 'function') {
          window.initVaikunthapaliWorldMap(mapFrame);
        }
        showPin(0);
        return;
      }
      if (g.id === 'puli-meka') {
        if (typeof window.initPuliMekaWorldMap === 'function') {
          window.initPuliMekaWorldMap(mapFrame);
        }
        showPin(0);
        return;
      }
      if (g.id === 'daadi-aata') {
        if (typeof window.initDaadiAataWorldMap === 'function') {
          window.initDaadiAataWorldMap(mapFrame);
        }
        showPin(0);
        return;
      }
      if (g.id === 'ashta-chamma') {
        if (typeof window.initAshtaChammaWorldMap === 'function') {
          window.initAshtaChammaWorldMap(mapFrame);
        }
        showPin(0);
        return;
      }
      if (g.id === 'chaturangam') {
        if (typeof window.initChaturangamWorldMap === 'function') {
          window.initChaturangamWorldMap(mapFrame);
        }
        showPin(0);
        return;
      }
      if (g.id === 'vamana-guntalu') {
        if (typeof window.initVamanaGuntaluWorldMap === 'function') {
          window.initVamanaGuntaluWorldMap(mapFrame);
        }
        showPin(0);
        return;
      }

      // Restore standard map placeholder structure if switching from Vaikunthapali
      if (!document.getElementById('map-paths')) {
        mapFrame.innerHTML = `
          <svg class="paths" id="map-paths"></svg>
          <div class="map-title" id="map-title"></div>
          <div id="map-pins"></div>
          <div class="map-caption" id="map-caption"></div>
        `;
      }

      // map — the pin coordinates are a schematic, not real geography, so each
      // game's pins are stretched to fill the space under the map title
      const xs = g.pins.map(p => p.x), ys = g.pins.map(p => p.y);
      const spread = (v, lo, hi, a, b) => hi === lo ? (a + b) / 2 : a + (v - lo) / (hi - lo) * (b - a);
      const pos = g.pins.map(p => ({
        x: spread(p.x, Math.min(...xs), Math.max(...xs), 18, 82),
        y: spread(p.y, Math.min(...ys), Math.max(...ys), 42, 82)
      }));
      document.getElementById('map-title').innerHTML = `<strong>Where it's played</strong>${g.mapSub}`;
      const pinsWrap = document.getElementById('map-pins');
      pinsWrap.innerHTML = '';
      g.pins.forEach((p, i) => {
        const pin = document.createElement('button');
        pin.type = 'button';
        pin.className = 'pin';
        pin.style.left = pos[i].x + '%';
        pin.style.top = pos[i].y + '%';
        pin.setAttribute('aria-label', `${p.name}, ${p.place}`);
        const pc = i === 0 ? '#C4881F' : '#C0524A';
        pin.innerHTML = `<svg viewBox="0 0 24 32">
      <path d="M12 1.5C6.2 1.5 1.5 6.2 1.5 12c0 8 10.5 18 10.5 18s10.5-10 10.5-18c0-5.8-4.7-10.5-10.5-10.5z" fill="${pc}" stroke="#FBF3E2" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="4" fill="#FBF3E2"/>
    </svg>`;
        pin.onclick = () => showPin(i);
        pinsWrap.appendChild(pin);
      });

      // stitched thread between pins, skipped where no single origin is claimed
      const svg = document.getElementById('map-paths');
      svg.innerHTML = '';
      if (g.path && g.pins.length > 1) {
        const pts = pos.map(p => `${p.x} ${p.y - 4}`);
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.innerHTML = `<path d="M ${pts.join(' L ')}" fill="none" stroke="#C7A467" stroke-width="0.6" stroke-dasharray="1.2 2" stroke-linecap="round" opacity="0.9"/>`;
      } else {
        svg.removeAttribute('viewBox');
      }
      document.getElementById('map-caption').textContent = g.path ? 'Dotted line traces its journey · tap a pin' : 'No single origin claimed · tap a pin';

      showPin(0);
    }

    function showPin(i) {
      const g = currentGame, p = g.pins[i];
      document.querySelectorAll('#map-pins .pin').forEach((el, j) => el.classList.toggle('active', j === i));
      const facts = screens[g.id].facts.map(f => `<li>${f}</li>`).join('');
      const box = document.getElementById('d-facts');
      box.innerHTML = `
    <p class="fact-place">${p.place}</p>
    <h3>${p.name}</h3>
    <p class="fact-story">${p.fact}</p>
    <p class="fact-how">${p.how}</p>
    <ul class="did-you-know"><li class="dyk-label">Did you know</li>${facts}</ul>`;
      box.scrollTop = 0;
    }

    function setMode(m) {
      currentMode = m;
      if (!currentGame.hasSoloMode) return;
      const solo = m === 'solo';
      document.getElementById('mode-solo').classList.toggle('active', solo);
      document.getElementById('mode-mascot').classList.toggle('active', !solo);
      document.getElementById('mode-solo').setAttribute('aria-checked', solo);
      document.getElementById('mode-mascot').setAttribute('aria-checked', !solo);
    }

    function setLevel(level) {
      currentLevel = level;
      document.querySelectorAll('#d-difficulty .diff-btn').forEach(b => {
        b.setAttribute('aria-checked', b.dataset.level === level);
      });
      document.getElementById('d-diff-note').textContent = screens[currentGame.id].difficulty[level];
    }
    document.querySelectorAll('#d-difficulty .diff-btn').forEach(b => {
      b.addEventListener('click', () => { setLevel(b.dataset.level); saveLevel(currentGame.id, b.dataset.level); });
    });

    /* ---------------- Tutorial / Rules sheet ---------------- */
    let tutStep = 0;
    let lastFocus = null;

    function openSheet(kicker, title) {
      lastFocus = document.activeElement;
      document.getElementById('modal').style.setProperty('--accent', currentGame.accent);
      document.getElementById('modal-kicker').textContent = kicker;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-overlay').classList.add('active');
    }
    function closeModal() {
      const o = document.getElementById('modal-overlay');
      if (!o.classList.contains('active')) return;
      o.classList.remove('active');
      if (lastFocus) lastFocus.focus();
    }
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target.id === 'modal-overlay') closeModal();
    });
    document.addEventListener('keydown', e => {
      if (!document.getElementById('modal-overlay').classList.contains('active')) return;
      if (e.key === 'Escape') closeModal();
      if (document.getElementById('tut-next')) {
        if (e.key === 'ArrowRight') tutGo(1);
        if (e.key === 'ArrowLeft') tutGo(-1);
      }
    });

    function openTutorial() {
      const sc = screens[currentGame.id];
      // Daadi Aata ships its own interactive tutorial — hand off to it
      if (currentGame.id === 'daadi-aata') { window.location.href = 'games/daadi-aata/dist/index.html?start=tutorial'; return; }
      // Chaturangam ships its own interactive lessons — hand off to them
      if (sc.tutorialHref) { window.location.href = sc.tutorialHref; return; }
      tutStep = 0;
      openSheet(`${currentGame.name} · Tutorial`, '');
      renderTutorial();
      document.getElementById('tut-next').focus();
    }
    function renderTutorial() {
      const steps = screens[currentGame.id].tutorial;
      const st = steps[tutStep];
      const last = tutStep === steps.length - 1;
      document.getElementById('modal-title').textContent = `Step ${tutStep + 1} of ${steps.length}`;
      document.getElementById('modal-body').innerHTML = `
    <div class="tut-step">
      <div class="tut-num">${tutStep + 1}</div>
      <div><h4>${st.t}</h4><p>${st.d}</p></div>
    </div>
    ${st.tip ? `<div class="tut-tip"><img src="kreedu-mascot.png" alt=""><span><strong>Kreedu's tip:</strong> ${st.tip}</span></div>` : ''}`;
      document.getElementById('modal-foot').innerHTML = `
    <div class="tut-dots" aria-hidden="true">${steps.map((_, i) => `<span class="${i === tutStep ? 'on' : ''}"></span>`).join('')}</div>
    <div class="tut-nav">
      <button class="pill-btn" type="button" onclick="tutGo(-1)" ${tutStep === 0 ? 'disabled' : ''}>Back</button>
      <button class="pill-btn solid" id="tut-next" type="button" onclick="${last ? 'closeModal(); startPlay()' : 'tutGo(1)'}">${last ? 'Play Now' : 'Next'}</button>
    </div>`;
    }
    function tutGo(d) {
      const n = screens[currentGame.id].tutorial.length;
      const next = tutStep + d;
      if (next < 0 || next >= n) return;
      tutStep = next;
      renderTutorial();
      document.getElementById('tut-next').focus();
    }

    function openRules() {
      const sc = screens[currentGame.id];
      openSheet(`${currentGame.name} · Rules`, 'How to play');
      document.getElementById('modal-body').innerHTML = sc.rules.map(r => `
    <div class="rules-section">
      <h4>${r.h}</h4>
      <ul>${r.items.map(i => `<li>${i}</li>`).join('')}</ul>
    </div>`).join('');
      document.getElementById('modal-foot').innerHTML = `
    <p class="rules-note">${sc.rulesNote || 'Stuck? The Tutorial walks through it step by step.'}</p>
    <button class="pill-btn solid" type="button" onclick="closeModal(); startPlay()">Play Now</button>`;
      document.getElementById('modal').focus();
    }

    /* ---------------- play ---------------- */
    function startPlay() {
      const g = currentGame;
      const destinations = {
        vaikunthapali: `games/vaikunthapali/dist/index.html?start=play&mode=${currentMode}`,
        'puli-meka': 'games/puli-meka/dist/index.html?start=play',
        'ashta-chamma': 'games/ashta-chamma/dist/index.html?start=play',
        'vamana-guntalu': 'games/vamana-guntalu/vamana-guntalu.html',
        chaturangam: 'chadarangam/dist/index.html?start=setup',
        'daadi-aata': 'games/daadi-aata/dist/index.html?start=mode_select'
      };
      window.location.href = destinations[g.id];
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }
  </script>
</body>

</html>
